</head>


<body bgcolor="#f3e5f5">


<div align="center">
<font face="Arial, Comic Sans MS, sans-serif">

  <table align="center" width="100%" bgcolor="#d1b3ff" cellpadding="10">
    <tr>
      <td align="center">
      </td>
    </tr>
    <tr>
      <td align="center">
        <h1>Ysmael's Midterm Portfolio</h1>

        <a href="services.html">Services</a> |

        <a href="contact.html">Contact</a>
      </td>
    </tr>
  </table>
  <main>
    <h1>Contact Details</h1>

    <form action="#" method="post">


      <p>
        <label>Full Name:<br>
          <input type="text" name="fullname" required>
        </label>
      </p>


      <p>
        <label>Email Address:<br>
          <input type="email" name="email" required>
        </label>
      </p>


      <p>
        <label>Contact Number:<br>
          <input type="tel" name="phone">
        </label>
      </p>

      <p>
        <label>Choose a Subject:<br>
          <select name="subject">
            <option>General Question</option>
            <option>Service Inquiry</option>
            <option>Suggestion</option>
            <option>Other</option>
          </select>
        </label>
      </p>


      <p>
        <label>Your Message:<br>
          <textarea name="message" rows="5" cols="35"></textarea>
        </label>
      </p>


      <p>
        <input type="submit" value="Submit">
        <input type="reset" value="Clear Form">
      </p>


    </form>
  </main>
